<svg viewBox="0 0 16 22" xmlns="http://www.w3.org/2000/svg">
<!-- Cute chibi astronaut: big head, small body -->

<!-- Helmet (big round) -->
<rect x="4" y="0" width="8" height="1" fill="#6abf6a"/>
<rect x="3" y="1" width="10" height="1" fill="#6abf6a"/>
<rect x="2" y="2" width="12" height="1" fill="#6abf6a"/>
<rect x="2" y="3" width="12" height="1" fill="#6abf6a"/>
<rect x="2" y="4" width="12" height="1" fill="#6abf6a"/>
<rect x="2" y="5" width="12" height="1" fill="#6abf6a"/>
<rect x="2" y="6" width="12" height="1" fill="#6abf6a"/>
<rect x="2" y="7" width="12" height="1" fill="#6abf6a"/>
<rect x="2" y="8" width="12" height="1" fill="#6abf6a"/>
<rect x="3" y="9" width="10" height="1" fill="#6abf6a"/>
<rect x="4" y="10" width="8" height="1" fill="#6abf6a"/>

<!-- Visor (amber, big and centered) -->
<rect x="4" y="4" width="8" height="1" fill="#c8860a"/>
<rect x="4" y="5" width="8" height="3" fill="#ffaf00"/>
<rect x="4" y="8" width="8" height="1" fill="#c8860a"/>

<!-- Visor shine -->
<rect x="5" y="5" width="2" height="1" fill="#ffe066" opacity="0.6"/>

<!-- Body (small) -->
<rect x="5" y="11" width="6" height="1" fill="#87d787"/>
<rect x="5" y="12" width="6" height="1" fill="#87d787"/>
<rect x="5" y="13" width="6" height="1" fill="#87d787"/>
<rect x="5" y="14" width="6" height="1" fill="#87d787"/>

<!-- Chest dot -->
<rect x="7" y="12" width="2" height="1" fill="#00ff41"/>

<!-- Arms (stubby) -->
<rect x="3" y="12" width="2" height="3" fill="#87d787"/>
<rect x="11" y="12" width="2" height="3" fill="#87d787"/>

<!-- Legs (short) -->
<rect x="5" y="15" width="2" height="3" fill="#87d787"/>
<rect x="9" y="15" width="2" height="3" fill="#87d787"/>

<!-- Boots -->
<rect x="4" y="18" width="3" height="1" fill="#3d8b3d"/>
<rect x="9" y="18" width="3" height="1" fill="#3d8b3d"/>

</svg>
